<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notifications</title>
<style>
  body { margin: 0; padding: 32px; font-family: system-ui, sans-serif; color: #18181b; }
  .card { border: 1px solid #d4d4d8; border-radius: 12px; padding: 16px; max-width: 420px; }
  .group { margin-top: 16px; padding-top: 12px; border-top: 1px solid #e4e4e7; }
  .row { display: flex; justify-content: space-between; padding: 8px 0; }
</style>
</head>
<body>
  <div class="card">
    <h2>Notifications</h2>
    <div class="group">
      <h3>Email</h3>
      <div class="row"><span>Weekly digest</span><input type="checkbox" checked aria-label="Weekly digest"></div>
      <div class="row"><span>Invoice paid</span><input type="checkbox" aria-label="Invoice paid"></div>
    </div>
  </div>
</body>
</html>
