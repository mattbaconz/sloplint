<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Features</title>
<style>

  .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 48px; }
  .feature { text-align: center; }
  .icon { width: 48px; height: 48px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: #e0e7ff; }
</style>
</head>
<body>
  <section class="features">
    <div class="feature"><div class="icon"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6" fill="#4338ca"/></svg></div><h3>Fast sync</h3><p>Changes reach every device quickly.</p></div>
    <div class="feature"><div class="icon"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="4" width="12" height="12" fill="#4338ca"/></svg></div><h3>Secure</h3><p>Your data is protected.</p></div>
    <div class="feature"><div class="icon"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3 17 17H3Z" fill="#4338ca"/></svg></div><h3>Easy to use</h3><p>Get going in minutes.</p></div>
  </section>
</body>
</html>
