<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Product card</title>
<style>
  body { margin: 0; padding: 32px; font-family: system-ui, sans-serif; background: #f4f4f5; color: #18181b; }
  .card { width: 300px; border-radius: 16px; padding: 8px; background: #fff; }
  .thumb { height: 170px; border-radius: 16px; background: #a1a1aa; }
  .body { padding: 12px 8px 4px; }
</style>
</head>
<body>
  <article class="card">
    <div class="thumb" role="img" aria-label="Walnut desk organiser"></div>
    <div class="body"><h3>Walnut desk organiser</h3><p>Three trays, felt-lined.</p></div>
  </article>
</body>
</html>
