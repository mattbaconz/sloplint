<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ledgerly promo</title>
</head>
<body>
  <h1 class="title">Close the books in an afternoon</h1>
  <p class="sub">Bank sync, matching and approvals in one ledger</p>
  <img class="shot" src="app.png" alt="The Ledgerly reconciliation screen">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline();
    tl.from('.title', { opacity: 0, y: 20, duration: 0.6 })
      .from('.sub', { opacity: 0, y: 20, duration: 0.6 })
      .from('.shot', { opacity: 0, y: 20, duration: 0.6, ease: 'back.out(1.7)' });
  </script>
</body>
</html>
