name: False positive
description: sloplint flagged code that is fine
labels: [false positive]
body:
  - type: input
    id: rule
    attributes:
      label: Rule
      placeholder: UI-005
    validations:
      required: true
  - type: input
    id: path
    attributes:
      label: File path
      description: The path decides the language and whether the file counts as a test, a server module or a README.
      placeholder: src/app/pricing/page.tsx
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Smallest snippet that still triggers it
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why the code is right
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: sloplint version
      placeholder: npx @sloplint/cli --version
