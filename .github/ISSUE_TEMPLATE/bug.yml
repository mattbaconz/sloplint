name: Bug
description: A crash, a wrong score or a command that misbehaves
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      render: text
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: sloplint version, Node version and OS
      placeholder: 0.1.0, Node 22, Windows 11
