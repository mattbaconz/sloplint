name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The docs moved to https://sloplint.xyz/. Each old page forwards there, keeping the query and the #section.
      - run: |
          mkdir -p _site/site
          page() {
            printf '<!doctype html><meta charset="utf-8"><title>sloplint</title><meta name="robots" content="noindex"><link rel="canonical" href="https://sloplint.xyz/%s"><meta http-equiv="refresh" content="0; url=https://sloplint.xyz/%s"><script>location.replace("https://sloplint.xyz/%s" + location.search + location.hash)</script><a href="https://sloplint.xyz/%s">sloplint.xyz</a>
' "$2" "$2" "$2" "$2" > "_site/$1"
          }
          page index.html ''
          page site/index.html ''
          page site/score.html score
          page site/benchmark.html benchmark
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
